<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Periódica Completa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 65px);
            grid-template-rows: repeat(10, 75px);
            gap: 4px;
        }
        .element {
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .element:hover {
            transform: scale(1.1);
            z-index: 10;
            border-color: #fff;
        }
        .atomic-number { font-size: 8px; text-align: left; }
        .symbol { font-size: 16px; font-weight: bold; }
        .name { font-size: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mass { font-size: 7px; color: #ccc; }

        /* Cores por Categoria */
        .nao-metal { background-color: #2e5c31; }
        .gas-nobre { background-color: #1d4e68; }
        .metal-alcalino { background-color: #7c4a18; }
        .metal-alcalino-terroso { background-color: #7c7718; }
        .metal-transicao { background-color: #681d42; }
        .outros-metais { background-color: #2b4c5c; }
        .semimetal { background-color: #1d6852; }
        .halogenio { background-color: #4a1d68; }
        .lantanideo { background-color: #5c2b57; }
        .actinidio { background-color: #5c2b36; }
    </style>
</head>
